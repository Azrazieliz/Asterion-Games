name: Android APK
on:
  push:
    branches: [main, feature/pilot-codex-bridge-20261030, feature/shoujo-verified-reward-proof-20261030]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # Debug signing continuity for later CI APKs. GitHub cache is best-effort;
      # a secure production signing secret is required for a guaranteed release identity.
      - name: Restore persistent CI debug signer
        uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: asterion-pilot-ci-debug-signing-v2
      - name: Ensure reusable CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-signing
          if [[ ! -f .ci-signing/debug.keystore ]]; then
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore .ci-signing/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Asterion Pilot CI Debug,O=Android,C=US"
          fi
          test -s .ci-signing/debug.keystore
          keytool -list -keystore .ci-signing/debug.keystore \
            -storepass android -alias androiddebugkey
      - name: Assemble debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Record APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk \
            > app/build/outputs/apk/debug/SIGNING_CERTIFICATE.txt
          grep 'Signer #1 certificate SHA-256 digest' app/build/outputs/apk/debug/SIGNING_CERTIFICATE.txt
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AsterionPilot-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SIGNING_CERTIFICATE.txt
          if-no-files-found: error
